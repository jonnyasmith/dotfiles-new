name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runners ship bash, python3 and pwsh; zsh they do not, and check:shell
      # parses the zsh files with zsh itself.
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh

      # install: false stops the action installing anything; `mise run` below
      # resolves [tools] itself, which is where chezmoi and shellcheck come from.
      - uses: jdx/mise-action@v3
        with:
          install: false

      - run: mise trust --all

      - run: mise run check

  # A real init and apply, in a container, on the two families with a package
  # manager CI can drive. Nothing here is checked by the job above: rendering a
  # script proves it parses, not that the repositories it adds exist or that the
  # packages it names are in them.
  apply:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13, fedora:41]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Install what the bootstrap assumes
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y curl git sudo ca-certificates
          else
            dnf install -y curl git sudo
          fi

      # --promptBool is keyed on the prompt TEXT, not the data key, which is the
      # only way to answer .chezmoi.toml.tmpl without a terminal.
      - name: init and apply
        env:
          # mise resolves several tools through the GitHub API, which rate-limits
          # anonymous callers hard enough to fail a build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
          chezmoi init --apply --source "$PWD" \
            --promptBool "Work machine (adds a second git identity)=false"

      # An apply that is not idempotent is a bug that only shows up on the
      # second machine, or the second week.
      - name: apply again
        run: chezmoi apply --source "$PWD"
