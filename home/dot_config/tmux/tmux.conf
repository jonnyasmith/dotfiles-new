unbind r
bind r source ~/.config/tmux/tmux.conf

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

set -g extended-keys on
set -g extended-keys-format csi-u

bind x kill-pane

set-option -g renumber-windows on
set-option -g status-position top

set-option -g allow-rename off
set-window-option -g automatic-rename off

set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

set -g @catppuccin_status_modules_right "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind D run-shell "~/.config/tmux/scripts/dev-layout.sh '#{pane_current_path}'"
bind = run-shell "~/.config/tmux/scripts/even-bottom.sh"
bind o run-shell "~/.config/tmux/scripts/unwrap-layout.sh"
bind a run-shell "~/.config/tmux/scripts/jump-pane.sh ai"
bind e run-shell "~/.config/tmux/scripts/jump-pane.sh editor"
bind g run-shell "~/.config/tmux/scripts/jump-pane.sh git"
bind t run-shell "~/.config/tmux/scripts/jump-pane.sh terminal"

set -g pane-border-status top
set -g pane-border-format " #{?#{@role},#{@role},#{pane_index}} "

# -E closes the popup when the shell exits; -w/-h as percentages keep a margin
bind p display-popup -E -w 95% -h 95% -d "#{pane_current_path}"

unbind '"'
unbind %

# Must be set before tpm runs: without it tpm clones into ~/.config/tmux, and
# chezmoi already owns tpm itself as an external at the path below.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.local/share/tmux/plugins/tpm/tpm'
